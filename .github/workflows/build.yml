name: build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  IPHONEOS_DEPLOYMENT_TARGET: "17.0"
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"

jobs:
  rust-tests:
    name: Rust tests (macOS)
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          cache-key: tests
      - name: cargo test (inproc, lanmouse_rx, ios_bridge, iOS key mapping)
        working-directory: zed
        run: |
          cargo test -p inproc -p lanmouse_rx -p ios_bridge
          cargo test -p gpui_ios --lib

  simulator:
    name: Simulator strict pass (${{ matrix.app }})
    runs-on: macos-26
    timeout-minutes: 240
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # The GPUI smoke app gives fast feedback on the platform layer.
          - app: gpui
            package: zios_app
            bin: ZiOS
          - app: zed
            package: zed
            bin: zed
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          cache-key: simulator-${{ matrix.app }}
          targets: aarch64-apple-ios-sim
      - name: Cache ios_system frameworks
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ios/Frameworks
          key: ios-frameworks-${{ hashFiles('scripts/fetch_ios_system.sh') }}
      - name: Fetch ios_system frameworks
        run: scripts/fetch_ios_system.sh
      - name: Build for the Simulator (strict mode)
        run: scripts/build_app.sh sim --package ${{ matrix.package }} --bin ${{ matrix.bin }}
      - name: Strict Simulator test pass (JIT forced off, then on)
        timeout-minutes: 45
        run: scripts/sim_test.sh build/sim/ZiOS.app build/sim-results ${{ matrix.app }}
      - name: Publish screenshots and logs to the ci-results branch
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          RESULTS_BRANCH: ci-results-${{ matrix.app }}
        run: scripts/publish_ci_results.sh build/sim-results
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: simulator-screenshots-${{ matrix.app }}
          path: build/sim-results/*.png
          if-no-files-found: warn
      - name: Upload Simulator logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: simulator-logs-${{ matrix.app }}
          path: |
            build/sim-results/**/*.txt
            build/sim-results/logs/**
            build/sim-results/crash-reports/**
          if-no-files-found: warn
